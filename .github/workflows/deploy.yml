name: Deploy static content to Pages with DevOps Quality Gates

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Validação de Qualidade de Código (Linting & Security Checks)
  quality-gate:
    name: Code Quality & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install HTML validator
        run: npm install --global html-validate

      - name: HTML Syntax & Quality Check
        run: html-validate '*.html'

  # Job 2: Build, Audit e Implantação
  deploy:
    name: Build & Deploy to GitHub Pages
    needs: quality-gate # Só roda se o Job de qualidade passar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Job 3: Auditoria Automatizada Pós-Deploy (Lighthouse CI)
  lighthouse-audit:
    name: Performance & Accessibility Audit
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://digooow.github.io/
          uploadArtifacts: true
          temporaryPublicStorage: true
