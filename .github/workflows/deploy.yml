name: Deploy static content to Pages with DevOps Quality Gates

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Validação de Qualidade de Código (Linting & Security Checks)
  quality-gate:
    name: Code Quality & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install HTML validator
        run: npm install --global html-validate

      - name: HTML Syntax & Quality Check
        run: html-validate '*.html'

  # Job 2: Build, Audit e Implantação
  deploy:
    name: Build & Deploy to GitHub Pages
    needs: quality-gate # Só roda se o Job de qualidade passar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Pages
<<<<<<< HEAD
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
=======
        uses: actions/configure-pages@0d716cfc9995b090bb89fe8f531fc3c133ec89ef # v5.0.0
>>>>>>> f160b39ccd1bba3e0fa9a6cbcd22dc1a1006de19

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Job 3: Auditoria Automatizada Pós-Deploy (Lighthouse CI)
  lighthouse-audit:
    name: Performance & Accessibility Audit
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@72f881228236981b625ed765b928efb1786a1f55 # v11.0.0
        with:
          urls: |
            https://digooow.github.io/
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
